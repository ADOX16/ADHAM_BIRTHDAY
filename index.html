<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday Adham</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
:root{--bg:#1f2a44;--fg:#f3f1ea;--ac:#ff5d73;--yl:#ffd23f;--bl:#4cc9f0;--gr:#7bd88f;--grad:linear-gradient(135deg,#2a1f5c,#1f2a44 38%,#0f5b7a 68%,#5c1f4a)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{background:transparent;color:var(--fg);font-family:"Archivo Black",Impact,system-ui,sans-serif;overflow-x:hidden}
button{font:inherit;cursor:pointer}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:var(--grad);background-size:300% 300%;animation:bgm 20s ease infinite}
@keyframes bgm{50%{background-position:100% 100%}}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.sh{position:absolute;top:0;left:0;opacity:.55;will-change:transform;animation:fl var(--d) linear var(--dl) infinite}
.sh.c{border-radius:50%;background:var(--k)}
.sh.r{border-radius:50%;border:.45em solid var(--k)}
.sh.q{background:var(--k);border-radius:18%}
.sh.s{background:var(--k);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.sh.t{background:var(--k);clip-path:polygon(50% 0,100% 100%,0 100%)}
@keyframes fl{from{transform:translate3d(0,112vh,0) rotate(0)}to{transform:translate3d(var(--dx),-25vh,0) rotate(var(--rt))}}

/* gate */
#gate{position:fixed;inset:0;z-index:50;background:var(--grad);display:flex;align-items:center;justify-content:center;transition:opacity .6s}
#gate.out{opacity:0;pointer-events:none}
#gate{flex-direction:column;gap:1.4rem}
#bar{width:min(60vw,260px);height:8px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;transition:opacity .4s}
#bar i{display:block;height:100%;width:0;background:var(--yl);transition:width .3s}
#bar.done{opacity:0}
#go{background:var(--ac);color:#fff;border:0;border-radius:999px;padding:1em 2em;font-size:clamp(1rem,4.5vw,1.4rem);opacity:.4;transition:opacity .4s,transform .15s}
#go:not([disabled]){opacity:1;animation:wig 1.6s ease-in-out infinite;box-shadow:5px 5px 0 var(--yl)}
@keyframes wig{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.07)}}
#go:active{animation:none;transform:scale(.94)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:60;pointer-events:none}

/* hero */
.hero{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(1rem,4vh,2.2rem);padding:max(1.5rem,env(safe-area-inset-top)) 1rem 3rem;text-align:center}
h1{font-weight:400;line-height:.95;font-size:clamp(2.6rem,13vw,7rem);letter-spacing:-.02em}
h1 .nm{display:inline-block;margin-top:.15em;background:var(--yl);color:#1f2a44;padding:.02em .22em .06em;border-radius:.2em;rotate:-3deg;box-shadow:.06em .06em 0 var(--ac)}
.w{display:inline-block;white-space:nowrap}
.ch{display:inline-block;opacity:0}
.go .ch{animation:drop .8s cubic-bezier(.34,1.56,.64,1) both,wob 2.6s ease-in-out calc(1.2s + var(--i)*90ms) infinite;animation-delay:calc(var(--i)*70ms),calc(1.4s + var(--i)*90ms)}
@keyframes drop{from{opacity:0;transform:translateY(-120%) rotate(-25deg) scale(.4)}to{opacity:1;transform:none}}
@keyframes wob{0%,100%{transform:none}25%{transform:translateY(-.08em) rotate(-4deg)}75%{transform:translateY(.03em) rotate(4deg)}}
.hero video{width:min(88vw,780px);max-height:52svh;background:#000;border:10px solid #fff;border-bottom-width:24px;border-radius:6px;box-shadow:8px 8px 0 var(--bl);rotate:-1.5deg}

/* steps */
.step{display:none;position:relative;min-height:100svh;align-items:center;justify-content:center;padding:1.2rem 1rem}
.step.on{display:flex}
.step{--r:2deg;--fx:0px;--sc:var(--ac)}
.step .m{max-width:88vw;max-height:80svh;background:#000;border:10px solid #fff;border-bottom-width:26px;border-radius:6px;box-shadow:9px 9px 0 var(--sc);opacity:0}
.step.show .m{animation:pop .95s cubic-bezier(.34,1.56,.64,1) both,bob 4.5s ease-in-out .95s infinite}
@keyframes pop{from{opacity:0;transform:translateX(var(--fx)) scale(.3) rotate(calc(var(--r)*-6))}to{opacity:1;transform:rotate(var(--r))}}
@keyframes bob{0%,100%{transform:rotate(var(--r))}50%{transform:translateY(-9px) rotate(calc(var(--r)*-.6))}}
.black{background:#000;padding:0;min-height:100vh;min-height:100dvh}
.step.black .m,.step.black.show .m{width:100%;height:100vh;height:100dvh;max-width:none;max-height:none;object-fit:contain;background:#000;border:0;border-radius:0;box-shadow:none;animation:none;transform:none;opacity:1;transition:none}
.black .hint{display:none}
html.final,html.final body{background:#000}
html.final body::before,html.final #bg,html.final .hero,html.final .step:not(.black){display:none}
.hint{position:absolute;bottom:calc(1rem + env(safe-area-inset-bottom));left:50%;translate:-50% 0;width:2.8rem;height:2.8rem;display:grid;place-items:center;border-radius:50%;background:var(--yl);color:#1f2a44;font-size:1.3rem;box-shadow:3px 3px 0 var(--ac);opacity:0;transition:opacity .5s}
.step.done .hint{opacity:1;animation:b 1.2s infinite}
@keyframes b{50%{transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important}.ch{opacity:1}.step.show .m{opacity:1;transform:rotate(var(--r))}.step.black.show .m{transform:none}}
</style>
</head>
<body>

<div id="bg"></div>
<div id="gate"><button id="go" disabled>Loading 0%</button><div id="bar"><i></i></div></div>
<canvas id="fx"></canvas>
<audio id="music" loop preload="auto"></audio>

<header class="hero">
  <h1>Happy birthday <span class="nm">Adham!!</span></h1>
  <video id="intro" controls playsinline preload="metadata"></video>
</header>
<main id="steps"></main>

<script>
/* ---------- CONTENT: edit file names here ---------- */
const INTRO_VOICE = 'media/voice1.mp3';                    // plays right after he taps Open
const STEPS = [
  ...Array.from({length:7},(_,i)=>({t:'img', src:`media/photo${i+1}.jpg`, voice:`media/voice${i+2}.mp3`})),   // photos 1-7 -> voices 2-8
  {t:'img', src:'media/gif1.gif', voice:'media/voice9.mp3'},                                                   // if it is a video, use t:'vid' and drop voice
  {t:'vid', src:'media/video1.mp4', voice:'media/voice10.mp3'},                                             // voice plays together with the video (add mute:true to silence the video's own sound)
  {t:'img', src:'media/photo8.jpg', voice:'media/voice11.mp3'},
  {t:'black', voice:'media/voice12.mp3', loop:'media/loop.mp4', loopMuted:false}
];
const MUSIC_VOL = .6, DUCK_VOL = .12;
/* --------------------------------------------------- */

const $ = s => document.querySelector(s);
const music = $('#music'), intro = $('#intro'), root = $('#steps');
let ctx, gain, stopped = false;

/* music volume (WebAudio gain so it also works on iPhone; plain volume as fallback) */
function setVol(v, ms = 600){
  if(gain){
    const t = ctx.currentTime;
    gain.gain.cancelScheduledValues(t);
    gain.gain.setValueAtTime(gain.gain.value, t);
    gain.gain.linearRampToValueAtTime(v, t + ms/1000);
  } else music.volume = v;
}
const resumeMusic = () => { if(!stopped){ music.play().catch(()=>{}); } };

/* file loading: tries other common extensions if the exact name is not found (GitHub is case-sensitive) */
const EXT = {img:['jpg','jpeg','png','webp','gif','JPG','JPEG','PNG'], vid:['mp4','mov','webm','MP4','MOV'], aud:['mp3','m4a','wav','ogg','MP3','M4A']};
const cands = (src, k) => { const b = src.replace(/\.[^./]+$/, ''); return [src, ...EXT[k].map(e => b + '.' + e)].filter((v, i, a) => a.indexOf(v) === i); };
const DEBUG = /debug/.test(location.search);
function miss(src){
  console.warn('missing file:', src);
  if(!DEBUG) return;
  let d = $('#dbg');
  if(!d){ d = document.createElement('div'); d.id = 'dbg'; d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99;background:#c00;color:#fff;font:12px monospace;padding:6px;white-space:pre-wrap'; document.body.appendChild(d); }
  d.textContent += 'missing: ' + src + '\n';
}
const BLOB = {}, deferred = []; let pre = false;         // BLOB: file name -> fully downloaded copy
function load(el, src, k){
  if(!pre){ deferred.push(() => load(el, src, k)); return; }
  if(BLOB[src]){ el.src = BLOB[src]; return; }
  const c = cands(src, k); let i = 0;
  el.addEventListener('error', () => { if(++i < c.length) el.src = c[i]; else { el.dataset.bad = 1; miss(src); } });
  el.src = c[0];
}
load(music, 'media/music.mp3', 'aud');
load(intro, 'media/intro.mp4', 'vid');
const VA = new Audio();                                  // one shared voice player (unlocked on tap so iPhones allow it later)
const SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';

/* ---------- preloader: download everything first, Open unlocks when done ---------- */
const FILES = [
  ['media/music.mp3','aud'], ['media/intro.mp4','vid'], [INTRO_VOICE,'aud'], ['media/pop.mp3','aud',true],
  ...STEPS.flatMap(t => [t.src && [t.src, t.t === 'img' ? 'img' : 'vid'], t.voice && [t.voice,'aud'], t.loop && [t.loop,'vid']].filter(Boolean))
];
const prog = new Map(FILES.map(f => [f[0], 0]));
function upd(){
  const pct = Math.floor([...prog.values()].reduce((a, b) => a + b, 0) / FILES.length * 100);
  $('#bar i').style.width = pct + '%'; $('#go').textContent = 'Loading ' + pct + '%';
}
async function grab(src, k, optional){
  const done = () => { prog.set(src, 1); upd(); };
  try {
    for(const u of cands(src, k)){
      const ac = new AbortController(), t = setTimeout(() => ac.abort(), 180000);
      const r = await fetch(u, {signal: ac.signal}); clearTimeout(t);
      if(!r.ok) continue;
      const total = +r.headers.get('content-length') || 0, rd = r.body.getReader(), parts = []; let got = 0;
      for(;;){
        const {done: end, value} = await rd.read(); if(end) break;
        parts.push(value); got += value.length;
        if(total){ prog.set(src, Math.min(.99, got / total)); upd(); }
      }
      BLOB[src] = URL.createObjectURL(new Blob(parts, {type: r.headers.get('content-type') || ''}));
      return done();
    }
    if(!optional) miss(src);
  } catch(e) { /* can't fetch (e.g. opened as a local file): fall back to normal loading */ }
  done();
}
(async () => {
  const q = [...FILES];
  await Promise.all([0,1,2,3].map(async () => { while(q.length){ const f = q.shift(); await grab(...f); } }));
  pre = true; deferred.forEach(f => f());
  $('#go').disabled = false; $('#go').textContent = 'Open'; $('#bar').classList.add('done');
})();

/* build steps */
const els = STEPS.map(s => {
  const el = document.createElement('section');
  el.className = 'step' + (s.t === 'black' ? ' black' : '');
  if(s.t === 'img') el.innerHTML = '<img class="m" alt="" decoding="async">', load(el.firstChild, s.src, 'img');
  if(s.t === 'vid') el.innerHTML = '<video class="m" playsinline preload="metadata"></video>', load(el.firstChild, s.src, 'vid');
  if(s.t === 'black') el.innerHTML = '<video class="m" playsinline preload="metadata" hidden></video>', load(el.firstChild, s.loop, 'vid');
  el.insertAdjacentHTML('beforeend', '<div class="hint" aria-hidden="true">&#8595;</div>');
  root.appendChild(el);
  return el;
});
els[0].classList.add('on');

/* playful extras: per-step tilt/entry direction, floating shapes, bouncy headline */
const SC = ['#ff5d73','#ffd23f','#4cc9f0','#7bd88f'];
els.forEach((el, i) => {
  if(STEPS[i].t === 'black') return;
  el.style.setProperty('--r', ((i % 2 ? -1 : 1) * (1.5 + Math.random() * 2.5)).toFixed(1) + 'deg');
  el.style.setProperty('--fx', ['-70vw','70vw','0px'][i % 3]);
  el.style.setProperty('--sc', SC[i % 4]);
});
(() => {
  const bg = $('#bg'), K = ['c','r','q','s','t'];
  for(let i = 0; i < 20; i++){
    const e = document.createElement('i'), z = 18 + Math.random() * 34;
    e.className = 'sh ' + K[i % 5];
    e.style.cssText = `left:${Math.random()*100}%;width:${z}px;height:${z}px;--k:${SC[i%4]};--d:${16+Math.random()*20}s;--dl:-${Math.random()*30}s;--dx:${(Math.random()-.5)*160}px;--rt:${(Math.random()>.5?1:-1)*(180+Math.random()*360)}deg`;
    bg.appendChild(e);
  }
  let n = 0;
  const h = document.querySelector('h1');
  [...h.childNodes].forEach(node => {
    const frag = document.createDocumentFragment(), txt = node.textContent;
    const build = (t) => t.split(/(\s+)/).forEach(w => {
      if(!w.trim()) return void frag.appendChild(document.createTextNode(' '));
      const ws = document.createElement('span'); ws.className = 'w';
      [...w].forEach(c => { const s = document.createElement('span'); s.className = 'ch'; s.style.setProperty('--i', n++); s.textContent = c; ws.appendChild(s); });
      frag.appendChild(ws);
    });
    if(node.nodeType === 3){ build(txt); node.replaceWith(frag); }
    else { node.textContent = ''; const keep = node; const save = txt; build(save); keep.appendChild(frag); }
  });
})();

/* helpers */
const wait = ms => new Promise(r => setTimeout(r, ms));

function voice(src){
  return new Promise(res => {
    const c = BLOB[src] ? [BLOB[src]] : cands(src, 'aud'); let i = 0, d = false;
    const fin = () => { if(d) return; d = true; VA.onended = VA.onerror = null; if(!stopped) setVol(MUSIC_VOL); res(); };
    VA.onended = fin;
    VA.onerror = () => { if(++i < c.length){ VA.src = c[i]; VA.play().catch(()=>{}); } else { miss(src); setTimeout(fin, 2500); } };
    if(!stopped) setVol(DUCK_VOL);
    VA.src = c[0];
    VA.play().catch(e => { if(e.name === 'NotAllowedError') setTimeout(fin, 2500); });
  });
}

function playVideo(v){
  return new Promise(res => {
    let d = false;
    const fin = () => { if(d) return; d = true; resumeMusic(); res(); };
    v.onended = fin;
    v.addEventListener('error', () => { if(v.dataset.bad) setTimeout(fin, 2500); });
    music.pause();
    v.play().catch(() => { v.controls = true; });       // autoplay blocked: let him press play
  });
}

async function run(i){
  const s = STEPS[i], el = els[i];
  if(s.t !== 'black') el.classList.add('show');
  if(s.t === 'img') await (s.voice ? voice(s.voice) : wait(s.hold || 3000));
  else if(s.t === 'vid'){
    const v = el.querySelector('video');
    if(s.mute) v.muted = true;
    const vo = !s.voice ? Promise.resolve() : new Promise(r => {   // voice starts when the video actually starts
      let on = false;
      const go = () => { if(on) return; on = true; voice(s.voice).then(r); };
      v.addEventListener('playing', go, {once:true});
      v.addEventListener('error', () => { if(v.dataset.bad) go(); });
      setTimeout(go, 8000);
    });
    await Promise.all([playVideo(v), vo]);
  }
  else {
    document.documentElement.classList.add('final');     // everything else disappears: plain black
    scrollTo(0, 0);
    stopped = true;                                      // music is finished for good
    setVol(0, 900); setTimeout(() => music.pause(), 1000);
    await wait(1500);
    await voice(s.voice);
    const v = el.querySelector('video');
    v.loop = true; v.muted = s.loopMuted === true; v.hidden = false;
    v.play().catch(() => {                               // sound blocked by the browser: start muted, unmute on first touch/click
      v.muted = true; v.play().catch(() => {});
      const un = () => { v.muted = false; };
      ['click','touchend','keydown'].forEach(ev => addEventListener(ev, un, {once:true}));
    });
    return;                                              // last step
  }
  el.classList.add('done');
  if(els[i+1]) els[i+1].classList.add('on');
}

/* start each step once it is mostly on screen */
const started = new Set();
const io = new IntersectionObserver(es => es.forEach(e => {
  const i = els.indexOf(e.target);
  if(e.isIntersecting && !started.has(i) && gateOpen){ started.add(i); run(i); }
}), {threshold:.6});
els.forEach(e => io.observe(e));

/* intro video: music pauses while it plays, stops playing when scrolled away */
intro.addEventListener('play', () => music.pause());
['pause','ended'].forEach(ev => intro.addEventListener(ev, resumeMusic));
new IntersectionObserver(es => es.forEach(e => { if(!e.isIntersecting) intro.pause(); })).observe(intro);

/* ---------- opening effect ---------- */
let gateOpen = false;   // becomes true once the intro voice has finished
const go = $('#go');


go.onclick = () => {
  document.body.classList.add('go');
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  ctx.resume();
  if(location.protocol.startsWith('http')){              // WebAudio on local files is silent in some browsers
    gain = ctx.createGain(); gain.gain.value = MUSIC_VOL;
    ctx.createMediaElementSource(music).connect(gain).connect(ctx.destination);
  } else music.volume = MUSIC_VOL;
  music.muted = true;                                   // unlock music player silently, real start comes after the pop
  music.play().then(() => { music.pause(); music.muted = false; music.currentTime = 0; }).catch(() => { music.muted = false; });
  VA.src = SILENT; VA.play().catch(()=>{});            // unlock voice player
  els.forEach((e, i) => { if(STEPS[i].t === 'vid' || STEPS[i].t === 'black'){ const v = e.querySelector('video'); v.muted = true; v.play().then(() => { v.pause(); v.currentTime = 0; v.muted = false; }).catch(() => { v.muted = false; }); } });
  $('#gate').classList.add('out');
  confetti();
  pop().then(startMusic);                               // background music starts once the pop sound is over
  voice(INTRO_VOICE).then(() => {                       // intro voice plays together with the pop; photos wait for it
    gateOpen = true;
    els.forEach(e => { if(e.classList.contains('on')) { io.unobserve(e); io.observe(e); } });
  });
};

function startMusic(){
  if(stopped || [...document.querySelectorAll('video')].some(v => !v.paused)) return;
  music.play().catch(() => {});
}

function pop(){                                          // resolves when the pop sound has finished
  return new Promise(res => {
    let used = false;
    const synth = () => {
      if(used) return; used = true;
      const n = ctx.sampleRate * .3, b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
      for(let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 6);
      const src = ctx.createBufferSource(), g = ctx.createGain();
      src.buffer = b; g.gain.value = .9; src.connect(g).connect(ctx.destination); src.onended = res; src.start();
    };
    const a = new Audio(BLOB['media/pop.mp3'] || 'media/pop.mp3');
    a.onended = res; a.onerror = synth;
    a.play().catch(synth);
    setTimeout(res, 6000);                               // safety: never block the music forever
  });
}

function confetti(){
  const c = $('#fx'), x = c.getContext('2d'), dpr = devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; x.scale(dpr, dpr);
  const cols = ['#ff5d73','#ffd23f','#4cc9f0','#f3f1ea','#7bd88f'], P = [];
  for(let k = 0; k < 2; k++) for(let i = 0; i < 90; i++){
    const ang = (k ? Math.PI - .25 : .25) + (Math.random()-.5) * .9, sp = 9 + Math.random() * 11;
    P.push({x:k ? innerWidth : 0, y:innerHeight, vx:Math.cos(ang)*sp*(k?1:1), vy:-Math.sin(ang)*sp,
            w:5+Math.random()*6, h:3+Math.random()*5, r:Math.random()*6, vr:(Math.random()-.5)*.4,
            c:cols[i % cols.length]});
  }
  let f = 0;
  (function tick(){
    x.clearRect(0, 0, innerWidth, innerHeight);
    P.forEach(p => {
      p.vy += .28; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.w/2, -p.h/2, p.w, p.h); x.restore();
    });
    if(++f < 220) requestAnimationFrame(tick); else x.clearRect(0, 0, innerWidth, innerHeight);
  })();
}
</script>
</body>
</html>
